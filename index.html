<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采样点热力图 - 黄河源区</title>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        .demo-title { position: absolute; top: 25px; left: 25px; z-index: 1; }
        h1 { font-size: 18px; margin: 0; color: rgb(180, 180, 190); }
        h3 { font-size: 12px; font-weight: normal; margin-top: 5px; color: rgb(150, 150, 150); }
    </style>
</head>
<body>
    <div class="demo-title">
        <h1>黄河源区采样点热力图</h1>
        <h3>79个样品 / 71个独立采样位置</h3>
    </div>
    <div id="map"></div>
    <script type="text/javascript">
        window._AMapSecurityConfig = {
            securityJsCode: "f6a8c2c70859d9cd8be6cc863ae07389",
        };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=c7f411d256ee3068c233796d0aba301c"></script>
    <script src="https://webapi.amap.com/loca?v=2.0&key=c7f411d256ee3068c233796d0aba301c"></script>
    <script>
        var map = new AMap.Map('map', {
            zoom: 7,
            center: [100.3, 34.1],
            pitch: 0,
            showLabel: true,
            viewMode: '2D',
            mapStyle: 'amap://styles/grey',
        });

        var loca = new Loca.Container({ map });

        var geo = new Loca.GeoJSONSource({
            url: 'https://raw.githubusercontent.com/yangbai145-source/sampling-heatmap/main/sampling_points.json',
        });

        var heatmap = new Loca.HeatMapLayer({
            zIndex: 10,
            opacity: 1,
            visible: true,
            zooms: [2, 22],
        });

        heatmap.setSource(geo, {
            radius: 25,
            unit: 'px',
            height: 100,
            gradient: {
                0.1: 'rgba(50,48,118,1)',
                0.2: 'rgba(127,60,255,1)',
                0.4: 'rgba(166,53,219,1)',
                0.6: 'rgba(254,64,95,1)',
                0.8: 'rgba(255,98,4,1)',
                1: 'rgba(236,220,79,1)',
            },
            value: function (index, feature) {
                return feature.properties.count;
            },
            min: 0,
            max: 3,
            heightBezier: [0, .53, .37, .98],
        });
        loca.add(heatmap);

        var scatter = new Loca.ScatterLayer({
            loca: loca,
            zIndex: 9,
            zooms: [10, 22],
            opacity: 1,
        });
        scatter.setSource(geo);
        scatter.setStyle({
            unit: 'meter',
            size: [200, 200],
            color: function (index, feat) {
                var count = feat.properties.count;
                if (count >= 3) return '#ff0000';
                if (count >= 2) return '#ff8800';
                return '#4FC3F7';
            },
        });

        map.on('viewchange', function () {
            var z = map.getZoom();
            heatmap.setOpacity(Math.max(0, 1 - (z - 12) / 4));
            scatter.setOpacity(Math.min(1, (z - 10) / 2));
        });
    </script>
</body>
</html>
